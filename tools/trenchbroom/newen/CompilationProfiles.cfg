{
	"profiles": [
		{
			"name": "Compile and play",
			"workdir": "${MAP_DIR_PATH}",
			"tasks": [
				{ "type": "export", "enabled": true, "stripTbProperties": true, "target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.map" },
				{ "type": "tool", "enabled": true, "tool": "${qbsp}", "parameters": "-hlbsp \"${MAP_BASE_NAME}-compile.map\" \"${MAP_BASE_NAME}.bsp\"", "treatNonZeroResultCodeAsError": true },
				{ "type": "tool", "enabled": true, "tool": "${vis}", "parameters": "\"${MAP_BASE_NAME}.bsp\"", "treatNonZeroResultCodeAsError": true },
				{ "type": "tool", "enabled": true, "tool": "${light}", "parameters": "\"${MAP_BASE_NAME}.bsp\"", "treatNonZeroResultCodeAsError": true },
				{ "type": "copy", "enabled": true, "source": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.bsp", "target": "${newen_maps}" },
				{ "type": "launchEngine", "enabled": true, "engineProfileId": "e515644c-8531-4c7a-ada6-b42bec7aaaf8", "treatLaunchFailureAsError": true }
			]
		},
		{
			"name": "Compile only",
			"workdir": "${MAP_DIR_PATH}",
			"tasks": [
				{ "type": "export", "enabled": true, "stripTbProperties": true, "target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.map" },
				{ "type": "tool", "enabled": true, "tool": "${qbsp}", "parameters": "-hlbsp \"${MAP_BASE_NAME}-compile.map\" \"${MAP_BASE_NAME}.bsp\"", "treatNonZeroResultCodeAsError": true },
				{ "type": "tool", "enabled": true, "tool": "${vis}", "parameters": "\"${MAP_BASE_NAME}.bsp\"", "treatNonZeroResultCodeAsError": true },
				{ "type": "tool", "enabled": true, "tool": "${light}", "parameters": "\"${MAP_BASE_NAME}.bsp\"", "treatNonZeroResultCodeAsError": true },
				{ "type": "copy", "enabled": true, "source": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.bsp", "target": "${newen_maps}" }
			]
		}
	],
	"version": 1
}
