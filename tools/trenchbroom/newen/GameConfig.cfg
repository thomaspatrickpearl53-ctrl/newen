{
    "version": 9,
    "name": "newen",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve" },
        { "format": "Standard" }
    ],
    "filesystem": {
        "searchpath": "valve",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".C"],
        "palette": "gfx/palette.lmp",
        "attribute": "wad"
    },
    "entities": {
        "definitions": [ "HalfLife.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "setDefaultProperties": true
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "hint*"
            },
            {
                "name": "Origin",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "origin"
            },
            {
                "name": "Null",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "null"
            },
            {
                "name": "Liquid",
                "match": "material",
                "pattern": "\**"
            }
        ]
    },
    "softMapBounds":"-131072 -131072 -131072 131072 131072 131072",
    "compilationTools": [
        { "name": "qbsp", "description": "newen-compiler's qbsp.exe (build-newen\\qbsp\\qbsp.exe). ${qbsp}" },
        { "name": "vis", "description": "newen-compiler's vis.exe (build-newen\\vis\\vis.exe). ${vis}" },
        { "name": "light", "description": "newen-compiler's light.exe (build-newen\\light\\light.exe). ${light}" },
        { "name": "newen_maps", "description": "newen's maps folder (hl_newen\\bin\\userdata\\valve\\maps). ${newen_maps}" }
    ]
}
